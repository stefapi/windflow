# Alembic — configuration WindFlow (STORY-120.1)
#
# L'URL de connexion (sqlalchemy.url) est VOLONTAIREMENT vide : elle est
# surchargée par backend/alembic/env.py depuis les settings applicatifs
# (DATABASE_URL / sqlite par défaut). Aucun secret dans ce fichier.

[alembic]
# Emplacement de l'infrastructure de migration (relatif à ce fichier,
# situé à la racine du repo — cf. Dockerfile.api COPY alembic.ini /app/).
script_location = backend/alembic

# Template de nom de fichier de migration : date + slug lisible.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone des dates de création des migrations (UTC par défaut).
timezone = UTC

# Encodage des fichiers de migration.
prepend_sys_path = .

# Valeurs par défaut des identifiants de révision.
version_path_separator = os

# sqlalchemy.url vide — surchargée par env.py depuis les settings.
# NE PAS remplir : l'URL peut contenir le mot de passe PostgreSQL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
